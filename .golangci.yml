version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - depguard # enforces the forbidden-library list (DESIGN.md §6)
    - errname
    - errorlint
    - exhaustive
    - fatcontext
    - forbidigo
    - forcetypeassert
    - gocritic
    - gosec
    - intrange
    - misspell
    - modernize # remove if your golangci-lint version lacks it
    - nilerr
    - noctx
    - perfsprint
    - prealloc
    - revive
    - sloglint
    - thelper
    - tparallel
    - unconvert
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
  settings:
    depguard:
      rules:
        petravault:
          files:
            - $all
          deny:
            - pkg: gopkg.in/yaml.v3
              desc: archived; use go.yaml.in/yaml/v3 (DESIGN.md §6)
            - pkg: github.com/spf13/viper
              desc: no config-merging framework (DESIGN.md §7)
            - pkg: lukechampine.com/blake3
              desc: one BLAKE3 implementation only, github.com/zeebo/blake3 (DESIGN.md §6)
    errcheck:
      check-type-assertions: true
    forbidigo:
      forbid:
        - pattern: ^log\.(Print|Fatal|Panic).*$
          msg: use log/slog
        - pattern: ^fmt\.Print(f|ln)?$
          msg: write to an injected io.Writer (cmd.OutOrStdout())
        - pattern: ^os\.Exit$
          msg: only cmd/petravault/main.go may exit the process
    gosec:
      excludes:
        - G304 # a backup tool opens caller-supplied paths by design;
          # paths from manifests go through os.Root (GO_GUIDELINES.md section 11)
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: error-return
        - name: error-naming
        - name: error-strings
        - name: context-as-argument
        - name: context-keys-type
        - name: var-naming
        - name: unused-parameter
    sloglint:
      no-mixed-args: true
      attr-only: true
      context: scope
  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - forbidigo
      - path: cmd/petravault/main\.go
        linters:
          - forbidigo

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      # The module path is hosting-independent (GO_GUIDELINES.md §4), so it
      # must be named here: otherwise gofumpt reads petravault/... imports
      # as standard-library and wants to merge the import groups.
      module-path: petravault
    goimports:
      local-prefixes:
        - petravault

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
