name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install REUSE tool
        run: pipx install reuse
      - name: Formatting
        run: go tool golangci-lint fmt --diff ./...
      - name: Modules are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - run: go mod verify
      - run: go vet ./...
      - run: go tool golangci-lint run
      - run: go build ./...
      - run: go test -race -shuffle=on -count=1 ./...
      - name: Fuzz chunker briefly
        run: go test -run='^$' -fuzz=FuzzChunker -fuzztime=30s ./internal/chunking
      - run: go tool govulncheck ./...
      - run: make license
      - run: make reuse

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5

  integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      # MinIO deleted minio/minio from Docker Hub in 2025 and archived its
      # repository in 2026; LocalStack images now require a license token at
      # startup, which public CI cannot provide. The S3 contract therefore
      # runs against Adobe S3Mock instead: Apache-2.0, zero-config,
      # path-style access like the other backends, conditional writes on
      # PutObject (which the lock protocol needs), and a documented
      # readiness endpoint. The tag is pinned deliberately; bump it via
      # reviewed PR.
      s3:
        image: adobe/s3mock:5.2.3
        ports:
          - 9090:9090
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod verify
      - run: go vet ./...
      - name: Wait for S3
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:9090/favicon.ico; then
              exit 0
            fi
            sleep 2
          done
          echo "S3 test server did not become ready" >&2
          exit 1
      - name: S3 contract against S3Mock
        env:
          PETRAVAULT_TEST_S3_ENDPOINT: http://localhost:9090
          PETRAVAULT_S3_ALLOW_HTTP: "1"
          PETRAVAULT_TEST_S3_BUCKET: petravault-test
          AWS_ACCESS_KEY_ID: petravault-test
          AWS_SECRET_ACCESS_KEY: petravault-test-password
          AWS_REGION: us-east-1
        run: go test -race -shuffle=on -count=1 -tags=integration ./...
