# Tag-based releases (DESIGN.md §13, GO_GUIDELINES.md §18).
#
# Pushing a `v*` tag builds reproducible-aim binaries (CGO_ENABLED=0,
# -trimpath, pinned toolchain from go.mod, version from the tag), a
# SHA256SUMS checksum file, and a CycloneDX SBOM, signs a SLSA
# build-provenance attestation over the artifacts with Sigstore (no keys to
# manage), then opens a *draft* GitHub release with those assets for
# maintainer review before publishing. Users verify with
# `gh attestation verify` (provenance) and `sha256sum -c SHA256SUMS`.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod verify
      - name: Build release binaries
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          for target in "linux amd64" "linux arm64" "darwin amd64" "darwin arm64" "windows amd64"; do
            set -- $target
            name="petravault-${GITHUB_REF_NAME}-$1-$2"
            [ "$1" = "windows" ] && name="$name.exe"
            GOOS="$1" GOARCH="$2" go build -trimpath \
              -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "dist/$name" ./cmd/petravault
          done
          ls -la dist
      - name: Checksums and SBOM
        run: |
          (cd dist && sha256sum ./* > SHA256SUMS)
          cat dist/SHA256SUMS
          make sbom
          mv bom.json dist/petravault-"${GITHUB_REF_NAME}".bom.json
      - name: Attest build provenance and SBOM
        uses: actions/attest@v4
        with:
          subject-path: "dist/*"
      - name: Attest SBOM
        uses: actions/attest@v4
        with:
          subject-path: "dist/*"
          sbom-path: dist/petravault-${{ github.ref_name }}.bom.json
      - name: Open draft release with artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --draft \
            --title "${GITHUB_REF_NAME}" \
            --notes "Petravault ${GITHUB_REF_NAME}. Verify with: gh attestation verify <binary> --repo <owner>/<repo>, then (cd dist && sha256sum -c SHA256SUMS). SBOM: *.bom.json (CycloneDX)." \
            dist/*
